<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RiskLens AI | Sign In</title>
  <meta name="description" content="Sign in to RiskLens AI." />
  <script>
    (function () {
      const authUrl = new URL("https://app.risklensai.org/auth");
      const params = new URLSearchParams(window.location.search || "");
      if (!params.get("return_to")) {
        params.set("return_to", "https://app.risklensai.org/agent");
      }
      params.forEach((value, key) => authUrl.searchParams.set(key, value));
      window.location.replace(authUrl.toString());
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #0f172a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100% - 32px, 420px);
      padding: 28px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: white;
      text-align: center;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
    }
    a {
      color: #2563eb;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Opening RiskLens AI sign in...</h1>
    <p>If you are not redirected automatically, <a id="auth-link" href="https://app.risklensai.org/auth?return_to=https%3A%2F%2Fapp.risklensai.org%2Fagent">continue to sign in</a>.</p>
  </main>
  <script>
    (function () {
      const authUrl = new URL("https://app.risklensai.org/auth");
      const params = new URLSearchParams(window.location.search || "");
      if (!params.get("return_to")) {
        params.set("return_to", "https://app.risklensai.org/agent");
      }
      params.forEach((value, key) => authUrl.searchParams.set(key, value));
      document.getElementById("auth-link").href = authUrl.toString();
    })();
  </script>
</body>
</html>
